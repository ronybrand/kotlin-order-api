version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # Wait 3 days before proposing a brand-new release: a compromised package is usually caught
    # within hours, and security updates are not delayed by this.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      # Kotlin, its compiler plugins and Ktor are released as sets.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      ktor:
        patterns:
          - "io.ktor*"
      weekly-batch:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      weekly-batch:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
