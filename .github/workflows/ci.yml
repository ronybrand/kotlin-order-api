name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request makes the older run pointless; a run on main is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      # Caches the Gradle home and writes it only from the default branch: a pull request reads what main saved.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Lint, unit tests and the coverage floor
        run: ./gradlew ktlintCheck test koverVerify --no-daemon
      # Real PostgreSQL (embedded, from Maven Central) and, for the broker test, the Docker daemon of the runner.
      - name: Integration tests
        run: ./gradlew integrationTest --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/reports/kover/
          retention-days: 7

  # The Dockerfile is what ships, and the unit and integration suites never build it: a break (a base image tag,
  # the Gradle layout, a moved main class) would only show up at deploy time. Builds both targets without pushing,
  # then scans the result.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          build-args: TARGET=${{ matrix.target }}
          load: true
          push: false
          tags: kotlin-order-api-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      # HIGH/CRITICAL findings with a fix available fail the build; unfixed ones are only noise nobody can act on
      # yet. Covers the OS packages of the base image and the libraries inside the image.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kotlin-order-api-${{ matrix.target }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Everything above checks the pieces. This starts the real stack from docker-compose.yml (PostgreSQL, RabbitMQ,
  # Mailpit, the API and the worker), signs tokens like the issuer would, and follows one order from creation to
  # the e-mail that confirming it sends: the only check that exercises both processes inside their containers.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: End-to-end smoke test
        run: bash scripts/smoke.sh

